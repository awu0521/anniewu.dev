<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480">
  <!-- Original illustration for annie wu's portfolio: a small debugging workshop. -->
  <defs>
    <clipPath id="win"><rect x="54" y="44" width="300" height="212" rx="4"/></clipPath>
  </defs>

  <!-- wall -->
  <rect width="560" height="480" fill="#FBF1E4"/>
  <g fill="#F3E5D3">
    <rect x="0" y="0" width="560" height="6"/>
    <rect x="400" y="60" width="18" height="18"/><rect x="430" y="96" width="12" height="12"/><rect x="500" y="40" width="12" height="12"/>
  </g>

  <!-- window -->
  <rect x="44" y="34" width="320" height="232" rx="8" fill="#FFFDF9" stroke="#28352F" stroke-width="3"/>
  <g clip-path="url(#win)">
    <rect x="54" y="44" width="300" height="212" fill="#DCECF4"/>
    <circle cx="282" cy="96" r="22" fill="#F5D9C6"/>
    <!-- far range -->
    <path d="M54 196 102 128l26 30 42-62 40 52 28-26 46 56 26-24 44 50v52H54z" fill="#C7D3E8"/>
    <path d="m170 96 14 18-8-2-6 8-6-8-8 4zM102 128l10 14-6-2-4 6-4-6-6 2z" fill="#FFFDF9"/>
    <!-- mid range -->
    <path d="M54 220 96 176l34 26 44-46 46 40 34-24 52 44 48-30v70H54z" fill="#A9C4B4"/>
    <!-- trees / near ridge -->
    <path d="M54 256v-30l18-8 22 10 30-16 26 14 34-18 30 16 26-10 34 18 30-14 30 12 20-6v32z" fill="#6F9474"/>
    <g fill="#4F7356">
      <path d="m78 236 10-24 10 24z"/><path d="m120 240 12-30 12 30z"/><path d="m214 238 10-26 10 26z"/><path d="m300 240 12-30 12 30z"/><path d="m330 242 8-20 8 20z"/>
    </g>
  </g>
  <path d="M204 44v212M54 150h300" stroke="#28352F" stroke-width="3"/>
  <rect x="36" y="262" width="336" height="14" rx="3" fill="#E8CDB2" stroke="#28352F" stroke-width="3"/>

  <!-- shelf with books + blocky plant -->
  <rect x="396" y="170" width="140" height="10" fill="#E8CDB2" stroke="#28352F" stroke-width="3"/>
  <g stroke="#28352F" stroke-width="2.5">
    <rect x="404" y="112" width="18" height="58" fill="#C3B2DC"/>
    <rect x="422" y="120" width="16" height="50" fill="#A9CDE0"/>
    <rect x="438" y="106" width="20" height="64" fill="#A8C29E"/>
    <rect x="458" y="124" width="14" height="46" fill="#E9B795" transform="rotate(8 465 170)"/>
  </g>
  <g>
    <rect x="490" y="146" width="34" height="24" fill="#D9A27B" stroke="#28352F" stroke-width="2.5"/>
    <rect x="496" y="140" width="22" height="8" fill="#8A6A4E"/>
    <g stroke="#28352F" stroke-width="2">
      <rect x="500" y="122" width="12" height="12" fill="#7FA383"/>
      <rect x="488" y="112" width="12" height="12" fill="#A8C29E"/>
      <rect x="512" y="108" width="12" height="12" fill="#7FA383"/>
      <rect x="500" y="98" width="12" height="12" fill="#A8C29E"/>
    </g>
    <rect x="504" y="134" width="4" height="8" fill="#4F7356"/>
  </g>

  <!-- desk -->
  <rect x="0" y="318" width="560" height="162" fill="#EBD4BC"/>
  <rect x="0" y="312" width="560" height="14" fill="#E2C2A2" stroke="#28352F" stroke-width="3"/>
  <g fill="#E2C8AE"><rect x="40" y="370" width="80" height="4"/><rect x="300" y="420" width="120" height="4"/><rect x="460" y="360" width="60" height="4"/></g>

  <!-- soccer ball -->
  <g transform="translate(70 290)">
    <ellipse cx="0" cy="34" rx="30" ry="6" fill="#28352F" opacity=".12"/>
    <circle r="30" fill="#FFFDF9" stroke="#28352F" stroke-width="3"/>
    <path d="m0-11 11 8-4 13H-7l-4-13z" fill="#28352F"/>
    <path d="M0-11v-18M11-3l17-6M7 10l10 15M-7 10l-10 15M-11-3l-17-6" stroke="#28352F" stroke-width="2.5"/>
    <path d="M-12-27-17-20M12-27 17-20M27 6l-2 9M-27 6l2 9M-8 28H8" stroke="#28352F" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- notebook -->
  <g transform="translate(130 330)">
    <path d="M0 8 120 0l120 8v110l-120-6-120 6z" fill="#28352F" opacity=".1" transform="translate(6 6)"/>
    <path d="M0 8 120 0v110L0 118z" fill="#FFFDF9" stroke="#28352F" stroke-width="3" stroke-linejoin="round"/>
    <path d="m120 0 120 8v110l-120-8z" fill="#FFFDF9" stroke="#28352F" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#A9CDE0" stroke-width="2">
      <path d="M14 30h92M14 46h92M14 62h92M14 78h92M14 94h92"/>
      <path d="M134 30h92M134 46h92M134 62h92M134 78h92M134 94h92"/>
    </g>
    <!-- tiny sketches: a bug crossed out + a checkmark list -->
    <g stroke="#28352F" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="30" y="34" width="20" height="26" rx="2" fill="#F5D9C6"/>
      <path d="M30 42h-8M30 52h-8M50 42h8M50 52h8M34 34l-3-6M46 34l3-6"/>
      <path d="m70 36 26 22M96 36 70 58" stroke="#84442A"/>
      <path d="m22 80 5 5 9-10M44 82h44" stroke-width="2"/>
      <path d="m140 38 5 5 9-10M162 40h50" stroke-width="2"/>
      <path d="m140 70 5 5 9-10M162 72h40" stroke-width="2"/>
      <rect x="140" y="92" width="12" height="12" stroke-width="2"/>
      <path d="M162 98h46" stroke-width="2"/>
    </g>
  </g>

  <!-- pencil -->
  <g transform="translate(300 446) rotate(-14)">
    <rect x="0" y="0" width="86" height="12" fill="#F5D9C6" stroke="#28352F" stroke-width="2.5"/>
    <rect x="70" y="0" width="16" height="12" fill="#C3B2DC" stroke="#28352F" stroke-width="2.5"/>
    <path d="M0 0-14 6 0 12z" fill="#FFFDF9" stroke="#28352F" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="m-9 4-5 2 5 2z" fill="#28352F"/>
  </g>

  <!-- microcontroller dev board (generic, no logos) -->
  <g transform="translate(404 344)">
    <rect x="4" y="6" width="120" height="66" rx="4" fill="#28352F" opacity=".12"/>
    <rect width="120" height="66" rx="4" fill="#3E6B70" stroke="#28352F" stroke-width="3"/>
    <rect x="40" y="14" width="44" height="34" rx="2" fill="#B7C3C4" stroke="#28352F" stroke-width="2.5"/>
    <path d="M46 22h32M46 30h32M46 38h20" stroke="#8C9A9B" stroke-width="2"/>
    <rect x="92" y="18" width="18" height="12" fill="#DCECF4" stroke="#28352F" stroke-width="2"/>
    <rect x="12" y="20" width="16" height="22" fill="#E9E1F3" stroke="#28352F" stroke-width="2"/>
    <circle cx="100" cy="46" r="4" fill="#9FD49A"/>
    <g fill="#E8D9A8">
      <rect x="8" y="58" width="5" height="5"/><rect x="18" y="58" width="5" height="5"/><rect x="28" y="58" width="5" height="5"/><rect x="38" y="58" width="5" height="5"/><rect x="48" y="58" width="5" height="5"/><rect x="58" y="58" width="5" height="5"/><rect x="68" y="58" width="5" height="5"/><rect x="78" y="58" width="5" height="5"/><rect x="88" y="58" width="5" height="5"/><rect x="98" y="58" width="5" height="5"/><rect x="108" y="58" width="5" height="5"/>
      <rect x="8" y="3" width="5" height="5"/><rect x="18" y="3" width="5" height="5"/><rect x="28" y="3" width="5" height="5"/><rect x="38" y="3" width="5" height="5"/><rect x="48" y="3" width="5" height="5"/><rect x="58" y="3" width="5" height="5"/><rect x="68" y="3" width="5" height="5"/><rect x="78" y="3" width="5" height="5"/><rect x="88" y="3" width="5" height="5"/><rect x="98" y="3" width="5" height="5"/><rect x="108" y="3" width="5" height="5"/>
    </g>
    <!-- RFID tag on a cord -->
    <path d="M120 40c14 4 20 18 14 34" stroke="#28352F" stroke-width="2" fill="none"/>
    <rect x="120" y="72" width="26" height="18" rx="4" fill="#F5D9C6" stroke="#28352F" stroke-width="2.5" transform="rotate(10 133 81)"/>
    <path d="M128 78q5-4 10 0M130 82q3-2 6 0" stroke="#28352F" stroke-width="1.6" fill="none" transform="rotate(10 133 81)"/>
  </g>

  <!-- mug -->
  <g transform="translate(486 270)">
    <path d="M10 -8q6-8 0-16M22 -8q6-8 0-16" stroke="#C9BFAF" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="0" y="0" width="38" height="44" rx="4" fill="#E9E1F3" stroke="#28352F" stroke-width="3"/>
    <path d="M38 10h6a8 8 0 0 1 0 16h-6" fill="none" stroke="#28352F" stroke-width="3"/>
    <rect x="8" y="14" width="8" height="8" fill="#C3B2DC"/><rect x="22" y="24" width="8" height="8" fill="#C3B2DC"/>
  </g>

  <!-- the pup (original character) -->
  <g transform="translate(380 262)">
    <ellipse cx="34" cy="62" rx="40" ry="8" fill="#28352F" opacity=".12"/>
    <!-- tail -->
    <path d="M62 44q20-6 16-26" stroke="#28352F" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M62 44q20-6 16-26" stroke="#FFF3E3" stroke-width="1" fill="none" stroke-linecap="round"/>
    <!-- body -->
    <path d="M6 62c-4-24 8-40 28-40s34 14 30 40z" fill="#FFF3E3" stroke="#28352F" stroke-width="3" stroke-linejoin="round"/>
    <path d="M18 62v-12M44 62v-12" stroke="#28352F" stroke-width="2.5" stroke-linecap="round"/>
    <!-- bandana -->
    <path d="M10 22h48l-24 20z" fill="#A8C29E" stroke="#28352F" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- head -->
    <ellipse cx="34" cy="0" rx="30" ry="26" fill="#FFF3E3" stroke="#28352F" stroke-width="3"/>
    <!-- floppy ears -->
    <path d="M8-14c-14 0-16 22-8 30 6 4 10-6 10-16z" fill="#E9B795" stroke="#28352F" stroke-width="3" stroke-linejoin="round"/>
    <path d="M60-14c14 0 16 22 8 30-6 4-10-6-10-16z" fill="#E9B795" stroke="#28352F" stroke-width="3" stroke-linejoin="round"/>
    <!-- face: content, slightly sleepy -->
    <path d="M20 0q4 4 8 0M40 0q4 4 8 0" stroke="#28352F" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="34" cy="9" rx="5" ry="3.5" fill="#28352F"/>
    <path d="M30 15q4 4 8 0" stroke="#28352F" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="16" cy="10" r="3.5" fill="#F5C7B4"/><circle cx="52" cy="10" r="3.5" fill="#F5C7B4"/>
    <!-- tiny magnifying glass on the desk -->
    <g transform="translate(-34 46) rotate(-20)">
      <circle r="9" fill="#DCECF4" stroke="#28352F" stroke-width="2.5"/>
      <path d="M7 6l10 8" stroke="#28352F" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- zzz -->
    <g fill="none" stroke="#574178" stroke-width="2" stroke-linejoin="round">
      <path d="M66-36h8l-8 8h8"/><path d="M80-50h6l-6 6h6"/>
    </g>
  </g>
</svg>
